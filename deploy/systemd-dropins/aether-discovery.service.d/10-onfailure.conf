# D-ALERT: fire an operator alert email whenever aether-discovery.service
# fails. See docs/delivery/OPS-ALERTING.md for the install + test-fire
# recipe. Note: this is a `Type=oneshot` unit run every 30 min by
# aether-discovery.timer, so OnFailure fires per failed run, not once.
[Unit]
OnFailure=aether-alert@%n.service
