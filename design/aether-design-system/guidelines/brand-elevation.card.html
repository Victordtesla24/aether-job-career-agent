<!-- @dsCard group="Brand" viewport="700x200" subtitle="elev-1 card · elev-2 raised · elev-3 overlay · gilt-card ceremonial" name="Elevation ladder" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Elevation ladder</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div class="elev-1" style="border-radius:var(--radius-2xl);padding:14px;height:74px"><p class="hx" style="margin:0">elev-1</p></div>
  <div class="elev-2" style="border-radius:var(--radius-2xl);padding:14px;height:74px"><p class="hx" style="margin:0">elev-2</p></div>
  <div class="elev-3" style="border-radius:var(--radius-2xl);padding:14px;height:74px"><p class="hx" style="margin:0">elev-3</p></div>
  <div class="gilt-card" style="padding:14px;height:74px"><p class="hx" style="margin:0">gilt-card</p></div>
</div>
  <p class="note">Blur is chrome-only: the command bar, mobile sheet, tab bar and elev-3 overlays. Content surfaces stay opaque so scrolling a hundred rows never composites a hundred blurs.</p>
</body></html>
