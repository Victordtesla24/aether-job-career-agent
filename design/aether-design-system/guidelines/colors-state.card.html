<!-- @dsCard group="Colors" viewport="700x176" subtitle="Six load-bearing semantics — neutral is never ok, warn is copper not gold" name="State tones" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>State tones</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="sw"><div><div class="chipbox" style="background:#6FAF8D;"></div><p class="nm">ok</p><p class="hx">#6FAF8D</p></div><div><div class="chipbox" style="background:#C8873A;"></div><p class="nm">warn</p><p class="hx">#C8873A</p></div><div><div class="chipbox" style="background:#B9544B;"></div><p class="nm">danger</p><p class="hx">#B9544B</p></div><div><div class="chipbox" style="background:#7C93BE;"></div><p class="nm">info</p><p class="hx">#7C93BE</p></div><div><div class="chipbox" style="background:#8C8A82;"></div><p class="nm">neutral</p><p class="hx">#8C8A82</p></div><div><div class="chipbox" style="background:#A08CB4;"></div><p class="nm">degraded</p><p class="hx">#A08CB4</p></div></div><p class="note">neutral = no data / not measured. degraded = produced nothing but did not fail. Colour is redundant reinforcement; the word always states the state.</p>
</body></html>
