<!-- @dsCard group="Brand" viewport="700x150" subtitle="Line — diamond — line, and the gold gradient hairline" name="Ornament & rules" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ornament & rules</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:flex;align-items:center;gap:12px;max-width:340px;margin:6px auto 20px">
  <span style="height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-border))"></span>
  <span style="width:7px;height:7px;transform:rotate(45deg);border:1px solid rgba(201,168,76,.55)"></span>
  <span style="height:1px;flex:1;background:linear-gradient(90deg,var(--gold-border),transparent)"></span>
</div>
<hr class="rule-gold">
  <p class="note">The ornament closes centred headings on ceremonial surfaces. Inside dense data views, separate bands with a luminance step (.band-recessed) instead.</p>
</body></html>
