<!-- @dsCard group="Brand" viewport="700x200" subtitle="One bounded gold light source per page, plus film grain" name="Atmosphere" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Atmosphere</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="atmos-hero film-grain" style="border-radius:var(--radius-2xl);overflow:hidden;padding:26px 20px;background:var(--ink-0)">
  <p class="type-page text-gilt" style="margin:0">Your search, right now</p>
  <p class="type-page-sub" style="margin:8px 0 0">Every figure below is fetched live from your workspace.</p>
</div>
  <p class="note">.atmos-page for the document ground, .atmos-hero behind the title band, .film-grain at 1.5% for texture. All static — a breathing background would be a claim that something moved.</p>
</body></html>
