<!-- @dsCard group="Colors" viewport="700x160" subtitle="Inherited verbatim from the AB Entertainment baseline" name="Gilt — the brand colour" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gilt — the brand colour</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="sw"><div><div class="chipbox" style="background:#B0923F;"></div><p class="nm">Gold dark</p><p class="hx">#B0923F</p></div><div><div class="chipbox" style="background:#C9A84C;"></div><p class="nm">Gold</p><p class="hx">#C9A84C</p></div><div><div class="chipbox" style="background:#D4B65C;"></div><p class="nm">Gold light</p><p class="hx">#D4B65C</p></div><div><div class="chipbox" style="background:#E8D5A3;"></div><p class="nm">Gold pale</p><p class="hx">#E8D5A3</p></div><div><div class="chipbox" style="background:rgba(201,168,76,0.20);"></div><p class="nm">Gold border</p><p class="hx">rgba(201,168,76,.20)</p></div></div><p class="note">Gold is punctuation: one filled gold control per surface, hairlines and active indicators everywhere else. Gold is a brand colour and is never a state.</p>
</body></html>
