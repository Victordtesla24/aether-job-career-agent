<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Data — JetBrains Mono</title>

<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}

<p class="mono" style="font-size:32px;line-height:1;letter-spacing:-.02em;margin:0 0 10px">42 · 18<span style="font-size:14px;vertical-align:super">%</span> · AU$164,500</p>
  <p class="mono" style="font-size:11px;color:var(--fg-3);margin:0">2026-08-14 09:41 AEST · run_8f2c41 · 0.87 conf · 128 rows</p>
