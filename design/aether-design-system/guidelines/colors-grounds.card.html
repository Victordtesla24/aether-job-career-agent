<!-- @dsCard group="Colors" viewport="700x160" subtitle="One ground, four elevations — never pure black, never a flat grey card" name="Obsidian grounds" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Obsidian grounds</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="sw"><div><div class="chipbox" style="background:#08080A;"></div><p class="nm">Ink 0 · page</p><p class="hx">#08080A</p></div><div><div class="chipbox" style="background:#0F0F12;"></div><p class="nm">Ink 1 · card</p><p class="hx">#0F0F12</p></div><div><div class="chipbox" style="background:#16161A;"></div><p class="nm">Ink 2 · raised</p><p class="hx">#16161A</p></div><div><div class="chipbox" style="background:#1E1E23;"></div><p class="nm">Ink 3 · hover</p><p class="hx">#1E1E23</p></div><div><div class="chipbox" style="background:#26262C;"></div><p class="nm">Ink 4 · well</p><p class="hx">#26262C</p></div></div><p class="note">Depth comes from luminance, not hue. A surface never gains a border colour to look raised — it steps up the ladder.</p>
</body></html>
