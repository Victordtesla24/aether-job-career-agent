<!-- @dsCard group="Brand" viewport="700x190" subtitle="The product's own gold compass mark — never redrawn or recoloured" name="The mark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>The mark</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:flex;align-items:center;gap:26px">
  <img src="../assets/aether-mark.png" alt="Aether mark" width="72" height="72" style="border-radius:var(--radius-md);border:1px solid var(--gold-muted)">
  <div>
    <p style="font-family:var(--font-display);font-size:26px;letter-spacing:.16em;text-transform:uppercase;margin:0;line-height:1">Aether</p>
    <p style="font-family:var(--font-body);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:6px 0 0">Job &amp; Career Agent</p>
  </div>
  <img src="../assets/aether-mark.png" alt="" width="32" height="32" style="border-radius:var(--radius-sm);border:1px solid var(--gold-muted)">
</div>
  <p class="note">assets/aether-mark.png (256px) and assets/aether-mark-512.png. Clear space equals half the mark's width; place it only on obsidian or a photographic scrim.</p>
</body></html>
