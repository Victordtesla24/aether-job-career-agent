<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Near-sharp controls, softly cut surfaces" name="Corner radii" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:flex;align-items:center;gap:14px"><div style="text-align:center"><div style="width:78px;height:52px;border-radius:2px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--hairline)"></div><p class="hx" style="margin:6px 0 0">2px</p><p class="hx" style="margin:2px 0 0;color:var(--fg-3)">buttons, chips, badges</p></div><div style="text-align:center"><div style="width:78px;height:52px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--hairline)"></div><p class="hx" style="margin:6px 0 0">6px</p><p class="hx" style="margin:2px 0 0;color:var(--fg-3)">inputs</p></div><div style="text-align:center"><div style="width:78px;height:52px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--hairline)"></div><p class="hx" style="margin:6px 0 0">10px</p><p class="hx" style="margin:2px 0 0;color:var(--fg-3)">list rows, tiles</p></div><div style="text-align:center"><div style="width:78px;height:52px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--hairline)"></div><p class="hx" style="margin:6px 0 0">14px</p><p class="hx" style="margin:2px 0 0;color:var(--fg-3)">sections, modals</p></div></div>
  <p class="note">The 2px control radius is the baseline's sharp-edge identity, softened just enough for a dense product UI.</p>
</body></html>
