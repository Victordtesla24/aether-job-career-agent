<!-- @dsCard group="Type" viewport="700x150" subtitle="One shimmering gold heading per screen — the single brand gesture" name="The gilded line" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>The gilded line</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<p class="type-display text-gilt" style="margin:0 0 12px">Your search, right now</p>
  <p class="type-page shimmer-gilt" style="margin:0">Experience the hunt like no other</p>
  <p class="note">.text-gilt for static gold; .shimmer-gilt animates the sweep at 3s and is disabled under prefers-reduced-motion. Never apply either to body copy.</p>
</body></html>
