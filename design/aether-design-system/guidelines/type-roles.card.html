<!-- @dsCard group="Type" viewport="700x300" subtitle="The named roles every screen composes from" name="Type roles" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Type roles</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:grid;gap:12px">
  <div><p class="hx" style="margin:0 0 3px">.type-page</p><p class="type-page" style="margin:0">Application Tracker</p></div>
  <div><p class="hx" style="margin:0 0 3px">.type-card-title</p><p class="type-card-title" style="margin:0">Needs approval</p></div>
  <div><p class="hx" style="margin:0 0 3px">.type-eyebrow</p><p class="type-eyebrow" style="margin:0">Pipeline</p></div>
  <div><p class="hx" style="margin:0 0 3px">.type-body / .type-meta</p><p class="type-body" style="margin:0">Queue clear — nothing is waiting on you right now.</p><p class="type-meta" style="margin:2px 0 0">requested 4 min ago · waiting on you</p></div>
  <div><p class="hx" style="margin:0 0 3px">.type-figure</p><p class="type-figure" style="margin:0">1,284</p></div>
</div>
</body></html>
