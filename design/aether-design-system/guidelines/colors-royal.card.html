<!-- @dsCard group="Colors" viewport="700x160" subtitle="Sapphire for agent intelligence, burgundy for offers — rare, never together" name="Royal secondaries" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Royal secondaries</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="sw"><div><div class="chipbox" style="background:#3E5A8C;"></div><p class="nm">Sapphire</p><p class="hx">#3E5A8C</p></div><div><div class="chipbox" style="background:#8FA8CE;"></div><p class="nm">Sapphire light</p><p class="hx">#8FA8CE</p></div><div><div class="chipbox" style="background:#722F37;"></div><p class="nm">Burgundy</p><p class="hx">#722F37</p></div><div><div class="chipbox" style="background:#B9707A;"></div><p class="nm">Burgundy light</p><p class="hx">#B9707A</p></div></div><p class="note">The deep values are fills and borders only; the light values are the readable text and icon colours on obsidian.</p>
</body></html>
