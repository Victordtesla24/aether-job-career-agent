<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4 · 8 · 16 · 24 · 40 · 64 · 112" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:flex;align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">4</p></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">8</p></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">16</p></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">24</p></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">40</p></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">64</p></div><div style="text-align:center"><div style="width:112px;height:112px;background:var(--gold-muted);border:1px solid var(--gold-border)"></div><p class="hx" style="margin:6px 0 0">112</p></div></div>
  <p class="note">Card padding 20px, grid gaps 16–24px, section rhythm 112px on public pages. Dense data views drop to 8px row gaps but never below 14px card padding.</p>
</body></html>
