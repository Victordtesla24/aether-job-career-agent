<!-- @dsCard group="Brand" viewport="700x170" subtitle="One curve, three durations — motion means something is working" name="Motion" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div style="display:flex;gap:12px;flex-wrap:wrap">
  <div class="elev-1" style="border-radius:var(--radius-lg);padding:12px 14px;min-width:120px"><p class="mono" style="margin:0;font-size:15px">120ms</p><p class="hx" style="margin:4px 0 0">hover, colour</p></div><div class="elev-1" style="border-radius:var(--radius-lg);padding:12px 14px;min-width:120px"><p class="mono" style="margin:0;font-size:15px">180ms</p><p class="hx" style="margin:4px 0 0">lift, border</p></div><div class="elev-1" style="border-radius:var(--radius-lg);padding:12px 14px;min-width:120px"><p class="mono" style="margin:0;font-size:15px">260ms</p><p class="hx" style="margin:4px 0 0">enter, overlay</p></div><div class="elev-1" style="border-radius:var(--radius-lg);padding:12px 14px;min-width:120px"><p class="mono" style="margin:0;font-size:15px">3s</p><p class="hx" style="margin:4px 0 0">gilt shimmer</p></div>
</div>
  <p class="note">Easing is cubic-bezier(0.25, 1, 0.5, 1) everywhere. Only a genuinely live thing animates: ok pulses, warn breathes, everything else is still. prefers-reduced-motion clamps all of it to one frame.</p>
</body></html>
