<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Body — AB Sans</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<p style="font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0 0 10px;max-width:60ch">Aether discovers roles, tailors your resume against each posting, and holds every outbound action for your approval.</p>
  <p style="font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--fg-2);margin:0 0 10px">13px secondary · 12px meta · 11px micro</p>
  <p style="font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0">Eyebrow · uppercase · 0.14em</p>
  <p class="note">Weights 300–900. Sentence case in prose, ALL CAPS with wide tracking for eyebrows, nav and button labels.</p>
</body></html>
