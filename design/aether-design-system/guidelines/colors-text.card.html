<!-- @dsCard group="Colors" viewport="700x170" subtitle="Warm parchment text on obsidian; two hairline weights plus a gold one" name="Text & hairlines" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Text & hairlines</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<div class="sw">
  <div><div class="chipbox" style="background:var(--ink-1);display:flex;align-items:center;justify-content:center;color:var(--fg-1);font-size:12px">Primary</div><p class="nm">fg-1</p><p class="hx">#F5F1E8</p></div>
  <div><div class="chipbox" style="background:var(--ink-1);display:flex;align-items:center;justify-content:center;color:var(--fg-2);font-size:12px">Secondary</div><p class="nm">fg-2</p><p class="hx">62%</p></div>
  <div><div class="chipbox" style="background:var(--ink-1);display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:12px">Muted</div><p class="nm">fg-3</p><p class="hx">46%</p></div>
  <div><div class="chipbox" style="background:var(--ink-1);display:flex;align-items:center;justify-content:center;color:var(--fg-4);font-size:12px">Faint</div><p class="nm">fg-4</p><p class="hx">34%</p></div>
  <div><div class="chipbox" style="background:var(--ink-1);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline-strong);position:relative"><span style="position:absolute;inset:auto 0 50% 0;height:1px;background:var(--gold-border)"></span></div><p class="nm">hairlines</p><p class="hx">.07 / .13 / gold .20</p></div>
</div>
  <p class="note">Body copy never sits at pure #FFF — parchment white keeps the black-and-gold palette warm.</p>
</body></html>
