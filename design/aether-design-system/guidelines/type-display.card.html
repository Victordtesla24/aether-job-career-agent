<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Display — AB Marquee</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw>div{flex:1 1 0;min-width:96px}
.chipbox{height:52px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}
.nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 2px;color:var(--fg-2)}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.note{font-size:10.5px;color:var(--fg-3);margin:14px 0 0;line-height:1.5}
</style>
</head><body>
<p style="font-family:var(--font-display);font-size:44px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px">Aether Career</p>
  <p style="font-family:var(--font-display);font-size:22px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);margin:0">Job Discovery · Resume Studio</p>
  <p class="note">300 / 400 / 500 / 700 / 900. Lowercase codepoints render as capitals, so never rely on it for sentence case. Tracking widens as size drops: 0.02em at hero, 0.06em at card-title.</p>
</body></html>
