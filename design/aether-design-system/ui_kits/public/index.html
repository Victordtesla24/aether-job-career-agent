<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether — Pricing</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--fg-1);font-family:var(--font-body);font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(201,168,76,.4),rgba(201,168,76,.15));border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font-body)}
</style>
</head><body class="atmos-page"><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../preview/ds-preview-loader.js"></script>
<script type="text/babel" data-presets="react" src="PublicShell.jsx"></script>
<script type="text/babel" data-presets="react" src="PricingScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="AuthScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const [view, setView] = React.useState("pricing");
  const go = (v) => { setView(v); window.scrollTo({ top: 0 }); };
  return (
    <>
      <PublicNav view={view} onView={go} />
      {view === "pricing" ? <PricingScreen onView={go} /> : null}
      {view === "auth" ? <AuthScreen onView={go} /> : null}
      {view === "done" ? <SignedInScreen onView={go} /> : null}
      <PublicFooter />
    </>
  );
}
DSPreview.ensure("../../").then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script>
</body></html>
