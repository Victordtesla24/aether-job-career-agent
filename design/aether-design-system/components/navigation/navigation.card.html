<!-- @dsCard group="Components" viewport="700x300" name="Navigation — PageHeader, SegmentedControl" subtitle="Display-face titles, gold underline tabs" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{margin:0;background:var(--ink-0);color:var(--fg-1);font-family:var(--font-body);padding:20px}.lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-4);margin:0 0 8px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../preview/ds-preview-loader.js"></script>
<script type="text/babel" data-presets="react">
DSPreview.ensure("../../").then((DS) => {
  const { PageHeader, SegmentedControl, Button } = DS;
  function Card() {
    const [tab, setTab] = React.useState("all");
    return (
      <div className="atmos-hero">
        <PageHeader
          title="Job Discovery"
          subtitle="Every role below was discovered by your agents and scored against your resume."
          action={<Button tone="primary" size="sm" icon="fa-solid fa-bolt">Run scout</Button>}
          ornament
          controls={
            <SegmentedControl
              ariaLabel="Market"
              idPrefix="market"
              value={tab}
              onChange={setTab}
              items={[
                { value: "all", label: "All roles", count: 128, icon: "fa-solid fa-layer-group" },
                { value: "au", label: "Australia", count: 96 },
                { value: "saved", label: "Saved", count: 12, icon: "fa-solid fa-bookmark" }
              ]}
            />
          }
          footnote="Counts are what the discovery stream has actually observed this session."
        />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
});
</script>
</body></html>
