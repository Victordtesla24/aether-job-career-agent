<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AETHER — artefact</title>
  <link rel="stylesheet" href="../aether-design-system/styles.css">
  <style>
    body {
      margin: 0;
      background: #08080A;
      color: #F5F1E8;
      font-family: "AB Sans", "DM Sans", Helvetica, sans-serif;
    }

    .wrap {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 24px 64px;
    }

    .rule {
      height: 3px;
      background: linear-gradient(96deg, #B0923F 0%, #C9A84C 38%, #E8D5A3 62%, #C9A84C 100%);
    }

    .card {
      background: #0F0F12;
      border: 1px solid rgba(201, 168, 76, 0.20);
      padding: 32px 40px 40px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #C9A84C;
      text-align: center;
    }

    h1 {
      font-family: "AB Marquee", "Playfair Display", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8D5A3;
      text-align: center;
      margin: 12px 0 8px;
    }

    .hairline {
      width: 44px;
      height: 1px;
      background: #C9A84C;
      margin: 16px auto 24px;
    }

    .body {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(245, 241, 232, 0.62);
    }

    .body p {
      margin: 0 0 16px;
    }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      color: #C9A84C;
    }

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(201, 168, 76, 0.20);
      font-size: 11px;
      color: rgba(245, 241, 232, 0.34);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="rule"></div>
    <article class="card">
      <div class="eyebrow">Aether CareerAI Agent</div>
      <h1>ARTEFACT TITLE</h1>
      <div class="hairline"></div>
      <div class="body">
        <p>Replace this paragraph. Use gilt only as punctuation. Numbers go in <span class="mono">JetBrains Mono</span>.
          No emoji. No coral. Unmeasured values read “not measured”.</p>
      </div>
      <footer>© 2026 Aether CareerAI Agent · A product of V² Group Pty. Ltd. · All rights reserved.</footer>
    </article>
    <div class="rule"></div>
  </div>
</body>

</html>
