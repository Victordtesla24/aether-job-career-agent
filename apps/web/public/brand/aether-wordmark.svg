<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-label="Aether Career Job Agent wordmark">
  <!-- Aether Career Job Agent — horizontal wordmark lockup.
       Design-system tokens: black #0A0A0A, gold gradient #B0923F → #C9A84C → #D4B65C,
       display serif (Playfair Display / Georgia fallback), eyebrow .25em tracking. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0923F"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#D4B65C"/>
    </linearGradient>
  </defs>
  <rect width="640" height="120" fill="#0A0A0A"/>
  <!-- mark -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M60 34 L79 84 L71.5 84 L67 72 L53 72 L48.5 84 L41 84 Z M60 50 L55.5 64 L64.5 64 Z"
        fill="url(#gold)"/>
  <!-- wordmark -->
  <text x="118" y="66" font-family="'Playfair Display',Georgia,'Times New Roman',serif"
        font-size="40" font-weight="700" fill="#FFFFFF">Aether</text>
  <text x="256" y="66" font-family="'Playfair Display',Georgia,'Times New Roman',serif"
        font-size="40" font-weight="400" fill="url(#gold)" font-style="italic">Career Job Agent</text>
  <!-- eyebrow rule + tagline -->
  <path d="M120 82 L560 82" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <text x="120" y="102" font-family="'DM Sans',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="700" letter-spacing="2.75" fill="#D4AF37">YOUR AI-POWERED JOB SEARCH AGENT</text>
</svg>
