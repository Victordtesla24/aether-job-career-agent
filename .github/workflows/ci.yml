name: CI

# GitHub-hosted runners only: nothing here runs on the VPS, no secret is needed, and pull requests from forks are safe.
#   web        lint, type-check and unit tests of the Next.js app
#   api-lint   ruff + mypy of the API, tool versions pinned in apps/api/requirements-lint.txt
#   api-tests  the full pytest suite against a throw-away Postgres service container, split into parallel shards
# Delivery to the VPS is the separate "VPS Delivery" workflow (push to main only).

on:
  push:
    branches: [main, "phase-*/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the root package.json "packageManager" field;
      # pinning a second version here makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm@11.9.0 (root packageManager) requires Node >= 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web type-check
      - run: pnpm --dir apps/web test

  api-lint:
    name: API — lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-lint.txt
      - run: pip install -r requirements-lint.txt
      - run: ruff check app/ tests/
      - run: mypy app/ --ignore-missing-imports

  api-tests:
    name: API — pytest shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The destructive fixtures only run against an isolated aether_test schema (scripts/run-tests.sh enforces it).
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/aether?schema=aether_test
      PGPASSWORD: postgres
      SENTENCE_TRANSFORMERS_HOME: /tmp/aether_models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install dependencies (CPU-only torch first, so pip never pulls the CUDA build)
        working-directory: apps/api
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: /tmp/aether_models
          key: sentence-transformers-all-MiniLM-L6-v2-v1
      - name: Download the embedding model (the ATS engine loads it with local_files_only)
        working-directory: apps/api
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', cache_folder='/tmp/aether_models')"
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/api/requirements.txt') }}
      - name: Install Chromium for the apply-executor tests
        working-directory: apps/api
        run: python -m playwright install --with-deps chromium
      - name: Install poppler (pdftoppm rasterises PDFs in the layout-preservation tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Create the test schema (structure of the production database, no data)
        run: psql -h 127.0.0.1 -U postgres -d aether -v ON_ERROR_STOP=1 -q -f apps/api/tests/schema/aether_structure.sql
      - name: Run this shard of the suite
        run: bash scripts/run-tests.sh -q -p no:cacheprovider --splits 4 --group ${{ matrix.shard }} --durations=15
