name: CI

on:
  push:
    branches: [main, "phase-*/*"]
  pull_request:

jobs:
  web:
    name: Web — lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the root package.json "packageManager" field;
      # pinning a second version here makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm@11.9.0 (root packageManager) requires Node >= 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web type-check
      - run: pnpm --dir apps/web test

  api:
    name: API — lint, types (+ DB tests when secret set)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check app/ tests/
      - run: mypy app/ --ignore-missing-imports

  # Full backend suite. Runs on the self-hosted VPS runner because the test
  # database is the VPS-local Postgres (the old hosted reai.io test DB resolves
  # to a private VPC address and is unreachable from GitHub-hosted runners —
  # proven 2026-08-18, see docs/delivery/evidence/RUN-20260818T0223Z). Uses an
  # isolated per-CI schema (aether_test_ci) via the repo's own provisioning
  # script, and refuses loudly when the secret is unset (constraint R7 — no
  # disabled verification).
  api-tests:
    name: API — full pytest suite (self-hosted, isolated schema)
    # Dedicated CI runner (aether-ci-2, user-space, label hostinger-vps-ci) so
    # full suites never occupy the root deploy runner's single slot. Deploy
    # jobs stay exclusively on [self-hosted, hostinger-vps].
    runs-on: [self-hosted, hostinger-vps-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Full backend suite against aether_test_ci
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          # TEST-ONLY Fernet key for the credential vault (ADR-PC-3); production
          # sets its own key in the server .env.
          AETHER_CREDENTIAL_KEY: ${{ secrets.AETHER_CREDENTIAL_KEY_TEST }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "::error::DATABASE_URL_TEST is not set — refusing to report success for a suite that did not run"
            exit 1
          fi
          # Shared-host memory guard: never start a full suite into an OOM
          # (runner was OOM-killed 2026-08-18 when suites stacked). Fail loudly
          # on timeout — never proceed into low memory.
          ok=""
          for i in $(seq 1 40); do
            avail=$(free -m | awk '/^Mem:/{print $7}')
            if [ "$avail" -ge 2500 ]; then ok=1; break; fi
            echo "waiting for memory headroom (${avail}MB available)"; sleep 30
          done
          if [ -z "$ok" ]; then
            echo "::error::memory headroom never reached 2500MB — refusing to start the suite into an OOM"
            exit 1
          fi
          # Reuse the host's fully-provisioned API venv instead of building a
          # fresh one: pip unpacking the torch/ML wheels is itself a multi-GB
          # memory event and was OOM-killed on this host (2026-08-18 14:43Z).
          # Tradeoff (recorded): CI depends on the dev venv being current; a
          # missing new dependency fails the suite loudly, which is visible.
          export PATH="/root/dev/aether-job-career-agent/apps/api/.venv/bin:$PATH"
          python3 -c "import pytest" || { echo "::error::host venv lacks pytest"; exit 1; }
          bash scripts/test-schema.sh provision ci
          trap 'bash scripts/test-schema.sh drop ci || true' EXIT
          AETHER_TEST_SCHEMA=aether_test_ci flock /tmp/aether-pytest-ci.lock \
            bash scripts/run-tests.sh -q
