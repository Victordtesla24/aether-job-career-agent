# Aether — build/test/deploy on the self-hosted Hostinger VPS runner.
#
# SCOPE: staging ONLY. Production runs on the Abacus VM at
# https://5cb5f0620.abacusai.cloud and is deliberately unreachable from this
# workflow: no prod host, credential or deploy target appears anywhere below.
# The existing .github/workflows/ci.yml (GitHub-hosted) is untouched.

name: VPS Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-staging
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: [self-hosted, hostinger-vps]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          echo "node $(node -v) | pnpm $(pnpm -v)"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-staging:
    name: Deploy to VPS staging
    needs: verify
    runs-on: [self-hosted, hostinger-vps]
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Update the staging checkout
        run: |
          set -euo pipefail
          cd /root/dev/aether-job-career-agent
          git fetch --all --prune
          git reset --hard origin/main
          # .env is staging-local and intentionally untracked; never overwritten here.
          test -f .env || { echo "staging .env missing"; exit 1; }
          grep -q "AETHER_ENV=staging" .env || { echo "refusing: .env is not the staging env"; exit 1; }
          if grep -qE "hosteddb\.reai\.io|5cb5f0620\.abacusai\.cloud" .env; then
            echo "refusing: staging .env references a production endpoint"; exit 1
          fi

      - name: Install + build with staging env
        run: |
          set -euo pipefail
          cd /root/dev/aether-job-career-agent
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          set +u; . /root/dev/.agent/staging/env.export.sh; set -u
          pnpm build

      - name: Restart staging services
        run: |
          set -euo pipefail
          systemctl restart aether-dev-api
          systemctl restart aether-dev-web
          sleep 15
          systemctl is-active aether-dev-api
          systemctl is-active aether-dev-web

      - name: Smoke test staging
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8100/health)
          [ "$code" = "200" ] || { echo "api health $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:3100/)
          [ "$code" = "200" ] || { echo "web $code"; exit 1; }
          echo "staging healthy: api 200, web 200"

      - name: Confirm production untouched
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://5cb5f0620.abacusai.cloud/ || echo 000)
          echo "production (read-only check, never deployed by this workflow): HTTP $code"
